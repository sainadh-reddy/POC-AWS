server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # AWS VPC Internal DNS Resolver (evaluates hostnames dynamically at request time)
    resolver 10.0.0.2 valid=10s ipv6=off;

    # ── Serve React SPA ───────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Proxy /api/* → api-gateway container ──────────────────────────────
    location /api/ {
        set $api_gateway_endpoint "api-gateway.poc-aws.local:8080";
        proxy_pass         http://$api_gateway_endpoint;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    30s;
    }

    # ── Proxy /actuator/* → api-gateway health ────────────────────────────
    location /actuator/ {
        set $api_gateway_endpoint "api-gateway.poc-aws.local:8080";
        proxy_pass         http://$api_gateway_endpoint;
        proxy_http_version 1.1;
        proxy_set_header   Host            $host;
        proxy_set_header   X-Real-IP       $remote_addr;
    }

    # ── Security Headers ──────────────────────────────────────────────────
    add_header X-Frame-Options       "SAMEORIGIN"   always;
    add_header X-XSS-Protection      "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header Referrer-Policy       "no-referrer"   always;
}
