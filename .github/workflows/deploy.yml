name: TicketDesk CI/CD Pipeline (M6)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: tkt-desk-ticket-service
  ECS_SERVICE: tkt-desk-service
  ECS_CLUSTER: tkt-desk-cluster
  ECS_TASK_DEFINITION: terraform/task-definition.json

jobs:
  # 1. Secret Scanning & Security Audit (Blocks pipeline if secrets found - Item 26)
  secret-scan:
    name: Secret & Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Run Unit Tests (Blocks pipeline if tests fail - Item 26)
  unit-test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Test Ticket Service
        run: |
          cd backend/ticket-service
          mvn test -B

  # 3. Build & Tag Docker Image with Commit SHA, Push to ECR, & Deploy to ECS (Item 25)
  build-and-deploy:
    name: Build, Push & Deploy to AWS ECS Fargate
    needs: [secret-scan, unit-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag with Commit SHA, and Push Image to ECR (Item 4)
        id: build-image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          # Build multi-stage Docker image
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG ./backend/ticket-service
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          # Push both commit SHA tag and latest tag
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      - name: Deploy to Amazon ECS Fargate Service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ env.ECS_TASK_DEFINITION }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
          wait-for-service-stability: true

  # 4. Smoke Test Deployed Environment (Item 27)
  smoke-test:
    name: Post-Deployment Smoke Test
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Get ALB URL and Run Health Smoke Test
        run: |
          ALB_URL=$(aws elbv2 describe-load-balancers --names tkt-desk-alb --query "LoadBalancers[0].DNSName" --output text)
          echo "Testing deployment health at http://$ALB_URL/actuator/health..."
          
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://$ALB_URL/actuator/health || echo "000")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Smoke test PASSED with status HTTP 200 OK!"
          else
            echo "Smoke test FAILED with status $HTTP_STATUS!"
            exit 1
          fi
