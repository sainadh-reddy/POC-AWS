name: TicketDesk Microservices CI/CD Pipeline (M6)

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: tkt-desk-cluster

jobs:
  # 1. Secret Scanning & Security Audit (Checklist Item 26)
  secret-scan:
    name: Secret & Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks Secret Scanner
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # 2. Build & Test All Maven Microservices
  unit-test:
    name: Test All Microservices
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Tests Across Microservices
        run: |
          for service in api-gateway auth-service ticket-service comment-service attachment-service dashboard-service eureka-server; do
            echo "Testing $service..."
            (cd backend/$service && mvn test -B)
          done

  # 3. Build & Deploy All 7 Microservice Containers to ECR & ECS Fargate
  build-and-deploy:
    name: Build & Deploy All 7 Microservices
    needs: [secret-scan, unit-test]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    strategy:
      matrix:
        service:
          - name: eureka-server
            ecr: tkt-desk-eureka-server
            ecs: tkt-desk-eureka-server
          - name: api-gateway
            ecr: tkt-desk-api-gateway
            ecs: tkt-desk-api-gateway
          - name: auth-service
            ecr: tkt-desk-auth-service
            ecs: tkt-desk-auth-service
          - name: ticket-service
            ecr: tkt-desk-ticket-service
            ecs: tkt-desk-ticket-service
          - name: attachment-service
            ecr: tkt-desk-attachment-service
            ecs: tkt-desk-attachment-service
          - name: comment-service
            ecr: tkt-desk-comment-service
            ecs: tkt-desk-comment-service
          - name: dashboard-service
            ecr: tkt-desk-dashboard-service
            ecs: tkt-desk-dashboard-service

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, Tag with Commit SHA, and Push to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
          SERVICE_NAME: ${{ matrix.service.name }}
          ECR_REPO: ${{ matrix.service.ecr }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG ./backend/$SERVICE_NAME
          docker tag $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPO:latest
          
          docker push $ECR_REGISTRY/$ECR_REPO:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPO:latest

      - name: Force Deployment Update on ECS Fargate Service
        env:
          SERVICE_ECS: ${{ matrix.service.ecs }}
        run: |
          aws ecs update-service --cluster ${{ env.ECS_CLUSTER }} --service $SERVICE_ECS --force-new-deployment

  # 4. Post-Deployment Smoke Test
  smoke-test:
    name: Post-Deployment Smoke Test
    needs: [build-and-deploy]
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Run Health Smoke Test
        run: |
          ALB_URL=$(aws elbv2 describe-load-balancers --names tkt-desk-alb --query "LoadBalancers[0].DNSName" --output text)
          echo "Testing deployment health at http://$ALB_URL/actuator/health..."
          
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://$ALB_URL/actuator/health || echo "000")
          if [ "$HTTP_STATUS" -eq 200 ]; then
            echo "Smoke test PASSED with status HTTP 200 OK!"
          else
            echo "Smoke test FAILED with status $HTTP_STATUS!"
            exit 1
          fi
